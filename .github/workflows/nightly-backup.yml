name: Nightly league backup

on:
  schedule:
    - cron: '17 9 * * *'   # every night, ~2–3am Mountain/Central
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Export league from Firestore
        run: python3 scripts/backup.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/league-export.json; then
            echo "Nothing new to back up."
            exit 0
          fi
          git config user.name "league-backup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league-export.json
          git commit -m "Nightly league backup $(date -u +%Y-%m-%d)"
          git push
